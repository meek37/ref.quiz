<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROLEX Ref Quiz</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.container{
    max-width:600px;
    margin:auto;
}

.card{
    background:white;
    border-radius:16px;
    padding:24px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:24px;
}

.info{
    margin:14px 0;
}

.label{
    font-size:14px;
    color:#666;
}

.value{
    font-size:24px;
    font-weight:bold;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:16px;
    font-size:22px;
    border:2px solid #ddd;
    border-radius:12px;
    margin-top:20px;
    text-transform:uppercase;
}

button{
    width:100%;
    padding:16px;
    margin-top:16px;
    border:none;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#submitBtn{
    background:#006039;
    color:white;
}

#nextBtn{
    background:#333;
    color:white;
    display:none;
}

.result{
    margin-top:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.correct{
    color:green;
}

.wrong{
    color:red;
}

.answer{
    margin-top:10px;
    text-align:center;
    font-size:20px;
}

.score{
    text-align:center;
    margin-bottom:20px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="score">
正解数: <span id="correct">0</span> /
出題数: <span id="total">0</span>
</div>

<div class="card">

<div class="title">ROLEX REF QUIZ</div>

<div class="info">
<div class="label">モデル</div>
<div class="value" id="model"></div>
</div>

<div class="info">
<div class="label">サイズ</div>
<div class="value" id="size"></div>
</div>

<div class="info">
<div class="label">ベゼル / ブレス</div>
<div class="value" id="bezel"></div>
</div>

<div class="info">
<div class="label">素材</div>
<div class="value" id="material"></div>
</div>

<input
id="answer"
placeholder="リファレンスを入力"
autocomplete="off">

<button id="submitBtn">
回答する
</button>

<button id="nextBtn">
次の問題
</button>

<div id="result" class="result"></div>
<div id="correctAnswer" class="answer"></div>

</div>

</div>

<script>

let data=[];
let current;

let total=0;
let correct=0;

async function loadCSV(){

    const res=await fetch('ref.csv');
    const text=await res.text();

    const lines=text.trim().split('\n');

    for(let i=1;i<lines.length;i++){

        const cols=lines[i].split(',');

        data.push({
            model:cols[0],
            size:cols[1],
            bezel:cols[2],
            material:cols[3],
            ref:cols[4]
        });
    }

    nextQuestion();
}

function nextQuestion(){

    current=data[Math.floor(Math.random()*data.length)];

    document.getElementById('model').textContent=current.model;
    document.getElementById('size').textContent=current.size+" mm";
    document.getElementById('bezel').textContent=current.bezel;
    document.getElementById('material').textContent=current.material;

    document.getElementById('answer').value='';

    document.getElementById('result').textContent='';
    document.getElementById('correctAnswer').textContent='';

    document.getElementById('submitBtn').style.display='block';
    document.getElementById('nextBtn').style.display='none';

    document.getElementById('answer').focus();
}

function checkAnswer(){

    const user=
        document.getElementById('answer')
        .value
        .trim()
        .toUpperCase();

    const ref=current.ref.toUpperCase();

    total++;

    if(user===ref){

        correct++;

        document.getElementById('result')
            .innerHTML='<span class="correct">⭕ 正解</span>';

    }else{

        document.getElementById('result')
            .innerHTML='<span class="wrong">❌ 不正解</span>';

        document.getElementById('correctAnswer')
            .textContent='正解: '+ref;
    }

    document.getElementById('correct').textContent=correct;
    document.getElementById('total').textContent=total;

    document.getElementById('submitBtn').style.display='none';
    document.getElementById('nextBtn').style.display='block';
}

document.getElementById('submitBtn')
.addEventListener('click',checkAnswer);

document.getElementById('nextBtn')
.addEventListener('click',nextQuestion);

document.getElementById('answer')
.addEventListener('keypress',e=>{
    if(e.key==='Enter'){
        checkAnswer();
    }
});

loadCSV();

</script>

</body>
</html>
