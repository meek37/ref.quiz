<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROLEX Reference Quiz</title>

<style>
body{
    font-family:sans-serif;
    max-width:700px;
    margin:auto;
    padding:20px;
    text-align:center;
}

.card{
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
    margin-top:20px;
}

.question{
    font-size:1.4rem;
    margin:10px 0;
}

input{
    width:250px;
    padding:10px;
    font-size:1.2rem;
    text-align:center;
}

button{
    padding:10px 20px;
    font-size:1rem;
    margin-left:10px;
}

#result{
    margin-top:15px;
    font-size:1.2rem;
    font-weight:bold;
}

.correct{
    color:green;
}

.wrong{
    color:red;
}
</style>
</head>

<body>

<h1>ROLEX Reference Quiz</h1>

<div class="card">

    <div class="question">
        <strong>モデル</strong><br>
        <span id="model"></span>
    </div>

    <div class="question">
        <strong>サイズ</strong><br>
        <span id="size"></span> mm
    </div>

    <div class="question">
        <strong>ベゼル / ブレス</strong><br>
        <span id="bezel"></span>
    </div>

    <br>

    <input
        type="text"
        id="answer"
        placeholder="Refを入力"
        autocomplete="off"
    >

    <button onclick="checkAnswer()">回答</button>

    <div id="result"></div>

</div>

<script>

let questions = [];
let current = null;

async function loadCSV() {

    const res = await fetch("ref.csv");
    const text = await res.text();

    const rows = text.trim().split("\n");

    const headers = rows[0].split(",");

    questions = rows.slice(1).map(row => {

        const cols = row.split(",");

        return {
            model: cols[0],
            size: cols[1],
            bezel: cols[2],
            material: cols[3],
            ref: cols[4]
        };
    });

    nextQuestion();
}

function nextQuestion(){

    current =
        questions[
            Math.floor(Math.random()*questions.length)
        ];

    document.getElementById("model").textContent =
        current.model;

    document.getElementById("size").textContent =
        current.size;

    document.getElementById("bezel").textContent =
        current.bezel;

    document.getElementById("answer").value = "";

    document.getElementById("result").textContent = "";

    document.getElementById("answer").focus();
}

function checkAnswer(){

    const user =
        document.getElementById("answer")
        .value
        .trim()
        .toUpperCase();

    const correct =
        current.ref
        .trim()
        .toUpperCase();

    const result =
        document.getElementById("result");

    if(user === correct){

        result.className = "correct";
        result.textContent = "〇 正解";

    }else{

        result.className = "wrong";
        result.textContent =
            `× 不正解（正解: ${current.ref}）`;
    }

    setTimeout(nextQuestion,1000);
}

document
.getElementById("answer")
.addEventListener("keydown",e=>{

    if(e.key==="Enter"){
        checkAnswer();
    }
});

loadCSV();

</script>

</body>
</html>
