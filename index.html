<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROLEX Ref</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100dvh;
}

.container{
    max-width:600px;
    margin:0 auto;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:24px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.info{
    margin-bottom:18px;
}

.label{
    font-size:14px;
    color:#777;
    margin-bottom:4px;
}

.model{
    font-size:32px;
    font-weight:700;
    line-height:1.2;
}

.value{
    font-size:22px;
    font-weight:600;
    line-height:1.3;
}

input{
    width:100%;
    padding:16px;
    font-size:24px;
    border:2px solid #ddd;
    border-radius:12px;
    margin-top:12px;
    text-transform:uppercase;
}

input:focus{
    outline:none;
    border-color:#006039;
}

button{
    width:100%;
    border:none;
    border-radius:12px;

    font-size:20px;
    font-weight:700;
    cursor:pointer;
}

    background:#006039;
    color:white;
}

    background:#333;

.correct{

.wrong{
    color:#d92d20;

.answer{
    margin-top:10px;

    font-weight:600;
}

.score{
    margin-top:16px;
    text-align:center;
    font-size:18px;
    font-weight:600;
    color:#555;
}

@media (max-width:480px){

    .model{
        font-size:28px;
    }

    .value{
        font-size:20px;
    }

    input{
        font-size:22px;
    }

    button{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="info">
            <div class="label">モデル</div>
            <div class="model" id="model"></div>
        </div>

        <div class="info">
            <div class="label">サイズ</div>
            <div class="value" id="size"></div>
        </div>

        <div class="info">
            <div class="label">ベゼル / ブレス</div>
            <div class="value" id="bezel"></div>
        </div>

        <div class="info">
            <div class="label">素材</div>
            <div class="value" id="material"></div>
        </div>

        <input
            id="answer"
            type="text"
            enterkeyhint="done"
            placeholder="リファレンスを入力"
            autocomplete="off"
            autocapitalize="characters">

        <button id="submitBtn">回答する</button>

        <div id="result" class="result"></div>

        <div id="correctAnswer" class="answer"></div>

        <div class="score">
            正解率: <span id="rate">0</span>%<br>
            (<span id="correct">0</span> /
            <span id="total">0</span>)<br>
            残り: <span id="remaining">0</span>問
        </div>

        <button id="nextBtn">次の問題</button>

    </div>

</div>

<script>

let data = [];
let questionPool = [];
let current = null;

let total = 0;
let correct = 0;

function shuffle(array){

    for(let i = array.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
        [array[j], array[i]];
    }

    return array;
}

async function loadCSV(){

    try{

        const response = await fetch("ref.csv");

        if(!response.ok){
            throw new Error("CSV読み込み失敗");
        }

        const text = await response.text();

        const lines = text.trim().split(/\r?\n/);

        for(let i=1;i<lines.length;i++){

            const cols = lines[i].split(",");

            if(cols.length < 5) continue;

            data.push({
                model: cols[0].trim(),
                size: cols[1].trim(),
                bezel: cols[2].trim(),
                material: cols[3].trim(),
                ref: cols[4].trim()
            });
        }

        questionPool = shuffle([...data]);

        updateScore();
        nextQuestion();

    }catch(error){

        console.error(error);
        alert("ref.csv の読み込みに失敗しました");
    }
}

function updateScore(){

    document.getElementById("correct").textContent = correct;
    document.getElementById("total").textContent = total;

    const rate =
        total === 0
        ? 0
        : ((correct / total) * 100).toFixed(1);

    document.getElementById("rate").textContent = rate;

    document.getElementById("remaining").textContent =
        questionPool.length;
}

function nextQuestion(){

    if(questionPool.length === 0){

        questionPool = shuffle([...data]);

        alert("全問題を出題しました。再シャッフルします。");
    }

    current = questionPool.pop();

    updateScore();

    document.getElementById("model").textContent =
        current.model;

    document.getElementById("size").textContent =
        current.size + " mm";

    document.getElementById("bezel").textContent =
        current.bezel;

    document.getElementById("material").textContent =
        current.material;

    document.getElementById("answer").value = "";

    document.getElementById("result").innerHTML = "";
    document.getElementById("correctAnswer").textContent = "";

    document.getElementById("submitBtn").style.display = "block";
    document.getElementById("nextBtn").style.display = "none";

    document.getElementById("answer").focus();
}

function checkAnswer(){

    document.getElementById("answer").blur();

    const userAnswer =
        document.getElementById("answer")
        .value
        .trim()
        .toUpperCase();

    const correctRef =
        current.ref
        .trim()
        .toUpperCase();

    total++;

    if(userAnswer === correctRef){

        correct++;

        document.getElementById("result").innerHTML =
            '<span class="correct">⭕ 正解</span>';

    }else{

        document.getElementById("result").innerHTML =
            '<span class="wrong">❌ 不正解</span>';

        document.getElementById("correctAnswer").textContent =
            "正解： " + current.ref;
    }

    updateScore();

    document.getElementById("submitBtn").style.display = "none";
    document.getElementById("nextBtn").style.display = "block";
}

const answerInput =
    document.getElementById("answer");

answerInput.addEventListener("focus", () => {

    setTimeout(() => {

        answerInput.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    },300);

});

document.addEventListener("keydown", function(e){

    if(e.key !== "Enter") return;

    const submitVisible =
        document.getElementById("submitBtn").style.display !== "none";

    const nextVisible =
        document.getElementById("nextBtn").style.display !== "none";

    if(submitVisible){

        e.preventDefault();
        checkAnswer();

    }else if(nextVisible){

        e.preventDefault();
        nextQuestion();
    }
});

document
.getElementById("submitBtn")
.addEventListener("click", checkAnswer);

document
.getElementById("nextBtn")
.addEventListener("click", nextQuestion);

loadCSV();

</script>

</body>
</html>
